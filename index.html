          <circle r="8"/><text x="14" y="7">ABOUT</text>
        </g>
        <g class="tick" data-dest="projects.html" transform="translate(330,112)">
          <circle r="8"/><text x="14" y="7">PROJECTS</text>

        <g class="tick" data-dest="contact.html" transform="translate(428,40)">
          <circle r="8"/><text x="16" y="-12">CONTACT</text>
